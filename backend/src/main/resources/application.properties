spring.application.name=farm-management

spring.datasource.url=jdbc:mariadb://localhost:3306/farm_management?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080

# JWT — access token is short-lived and returned in the login/refresh response body;
# refresh token is a random opaque string, sent only via httpOnly cookie, and stored
# server-side as a SHA-256 hash (see UserAccount.refreshTokenHash).
app.jwt.secret=<your secrete>
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Frontend origin allowed to send credentialed (cookie) requests
app.cors.allowed-origin=http://localhost:5173
